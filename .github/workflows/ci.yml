name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Also runs scripts/check-bundle.mjs, which fails the build if an API
      # token or an unoptimised PNG made it into dist/.
      - name: Build
        run: npm run build
